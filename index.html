<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Inspection Form</title>
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; display: flex; justify-content: center; }
        .card { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-top: 0; color: var(--primary); font-size: 24px; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; color: #4b5563; }
        input, select { width: 100%; padding: 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; background-color: #f9fafb; }
        input:focus, select:focus { outline: none; border-color: var(--primary); background-color: white; }
        input[type="file"] { padding: 10px; background: white; }
        .btn { width: 100%; background-color: var(--primary); color: white; padding: 16px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); transition: background-color 0.2s; }
        .btn:disabled { background-color: #9ca3af; box-shadow: none; cursor: not-allowed; }
        #status { text-align: center; margin-top: 20px; font-weight: 600; font-size: 15px; }
        .loading { text-align: center; font-size: 14px; color: #6b7280; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h2>Van Reporting</h2>
    <form id="inspectionForm">
        
        <div class="input-group">
            <label for="vanReg">Select Van</label>
            <select id="vanReg" required>
                <option value="">Loading fleet list...</option>
            </select>
        </div>

        <div class="input-group">
            <label for="mileage">Current Mileage</label>
            <input type="number" id="mileage" placeholder="e.g. 45000" required>
        </div>

        <div class="input-group">
            <label for="damageReported">Any new damage?</label>
            <select id="damageReported" required>
                <option value="No">No - Van is fine</option>
                <option value="Yes">Yes - Reporting damage</option>
            </select>
        </div>

        <div class="input-group" id="photoGroup">
            <label for="photo">Upload Photo (Required if damaged)</label>
            <input type="file" id="photo" accept="image/*" capture="environment">
        </div>

        <button type="submit" class="btn" id="submitBtn">Submit Report</button>
        <p id="status"></p>

    </form>
</div>

<script>
    // 👇 1. PASTE YOUR NEW "GET" URL HERE (To load the dropdown) 👇
    const getVansURL = "https://default267b2c46e98b42ef93ce19c08b7664.4d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5a4f7fb2b4604d3d8a8ce97b69b0348b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=lXWJit-Xl4zeEnTIq0jKkD_IMdVsUzQLrXsejEsIVZ8"; 
    
    // 👇 2. PASTE YOUR ORIGINAL "POST" CATCHER URL HERE (To save the data) 👇
    const submitReportURL = "https://default267b2c46e98b42ef93ce19c08b7664.4d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9e3e85b60f3947da92c42d990ddc422d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=4gSI0fxRNHaLKvsmfqx8kwBUUOMN5GPkStVnZGmhpGw"; 

    // Fetch the van list when page loads
    window.onload = async function() {
        const vanSelect = document.getElementById('vanReg');
        try {
            const response = await fetch(getVansURL);
            const vans = await response.json();
            vanSelect.innerHTML = '<option value="">-- Select a Van --</option>';
            vans.forEach(van => {
                // If your Select step output looks like ["YP71JYK", "YR23VEL"], use 'van'
                // If it looks like [{"VanReg": "YP71JYK"}], you'll need 'van.VanReg'
                let opt = document.createElement('option');
                opt.value = van; 
                opt.innerHTML = van;
                vanSelect.appendChild(opt);
            });
        } catch (error) {
            vanSelect.innerHTML = '<option value="">Error loading vans. Please type manually.</option>';
            // Fallback to text input if flow fails
            const input = document.createElement('input');
            input.type = 'text'; input.id = 'vanReg'; input.required = true; input.placeholder = "Enter Van Reg";
            vanSelect.parentNode.replaceChild(input, vanSelect);
        }
    };

    document.getElementById('inspectionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        btn.innerText = "Uploading Report...";
        status.innerText = "";

        const fileInput = document.getElementById('photo');
        let base64String = "";
        let fileName = "";

        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]); 
            reader.onerror = error => reject(error);
        });

        if (fileInput.files.length > 0) {
            base64String = await getBase64(fileInput.files[0]);
            fileName = fileInput.files[0].name;
        }

        const payload = {
            vanReg: document.getElementById('vanReg').value,
            mileage: document.getElementById('mileage').value,
            damageReported: document.getElementById('damageReported').value,
            photoBase64: base64String,
            photoName: fileName
        };

        try {
            const response = await fetch(submitReportURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                status.style.color = "#10b981"; // Green
                status.innerText = "✅ Report submitted successfully!";
                document.getElementById('inspectionForm').reset();
            } else { throw new Error("Failed"); }
        } catch (error) {
            status.style.color = "#ef4444"; // Red
            status.innerText = "❌ Error sending report. Try again.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Submit Report";
        }
    });
</script>

</body>
</html>
